[project]
name = "giskard-actions"
# Releases are versioned by git tags only (see release.yml); this value is never bumped.
version = "0.0.0"
description = "GitHub Actions for LLM-powered release notes and advisory Codex PR review"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "giskard-agents==1.0.6",
    "giskard-llm[azure]==1.0.3",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[project.scripts]
generate-release-notes = "release_notes.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# uv < 0.9.17 ignores this duration; CI's `uv sync --locked` then rejects the lock.
# To take an urgent fix sooner, add `exclude-newer-package = { <name> = false }`
# and remove it once that release is 7 days old. Mirror it on `uv tool install` in
# .github/actions/release-notes/action.yml (`--exclude-newer-package <name>=false`),
# which ignores this table; the generate-release-notes PR check fails otherwise.
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/ci/codex_pr_assessment.py" = ["E501", "UP022"]
"tests/test_codex_pr_assessment.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/ci"]
addopts = "--tb=short"
