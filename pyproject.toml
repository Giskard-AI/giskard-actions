[project]
name = "giskard-release-notes"
version = "0.3.0"
description = "Internal Giskard GitHub Actions: release notes CLI plus Codex review/CI reusable workflows"
requires-python = ">=3.12"
dependencies = [
    "giskard-agents==1.0.2",
    "giskard-llm[azure]==1.0.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[project.scripts]
generate-release-notes = "release_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/ci/codex_pr_assessment.py" = ["E501", "UP022"]
"tests/test_codex_pr_assessment.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["scripts/ci"]
addopts = "--tb=short"
