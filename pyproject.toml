[project]
name = "giskard-actions"
version = "0.3.0"
description = "GitHub Actions for LLM-powered release notes and advisory Codex PR review"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "giskard-agents==1.0.6",
    "giskard-llm[azure]==1.0.3",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[project.scripts]
generate-release-notes = "release_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/ci/codex_pr_assessment.py" = ["E501", "UP022"]
"tests/test_codex_pr_assessment.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["scripts/ci"]
addopts = "--tb=short"
