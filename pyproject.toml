[project]
name = "giskard-release-notes"
version = "0.2.0"
description = "Generate structured, LLM-powered release notes from git history"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
generate-release-notes = "release_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
