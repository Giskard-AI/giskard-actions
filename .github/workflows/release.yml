name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Cut SemVer Umbrella Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ci
      deployment: false
    permissions:
      contents: write # Create git tag and GitHub Release
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute next SemVer tag
        id: next
        shell: bash
        run: |
          python3 scripts/ci/write_github_output.py \
            --github-output "${GITHUB_OUTPUT}" \
            --compute-next-release-tag

      - name: Prepare local tag for release notes
        id: prep
        if: steps.next.outputs.should_release == 'true'
        shell: bash
        env:
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag -f "${NEXT_TAG}" "${TARGET_SHA}"
          echo "version=${NEXT_TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        if: steps.next.outputs.should_release == 'true' && steps.next.outputs.previous_tag != ''
        continue-on-error: true
        uses: $/.github/actions/release-notes
        with:
          version: ${{ steps.prep.outputs.version }}
          previous_tag: ${{ steps.next.outputs.previous_tag }}
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ vars.AZURE_AI_API_BASE }}
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_API_BASE }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub Release and tag
        if: steps.next.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes_file="release_notes/${NEXT_TAG}.md"
          if [[ -s "${notes_file}" ]]; then
            gh release create "${NEXT_TAG}" \
              --target "${TARGET_SHA}" \
              --title "${NEXT_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${NEXT_TAG}" \
              --target "${TARGET_SHA}" \
              --title "${NEXT_TAG}" \
              --generate-notes
          fi
