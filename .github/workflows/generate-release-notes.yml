name: Generate release notes (self-test)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.3.0)"
        required: true
        type: string
      previous_tag:
        description: "Override previous tag (auto-detect if empty)"
        required: false
        type: string
      model:
        description: "LiteLLM model name"
        required: false
        type: string
        default: azure_ai/gpt-4.1
      dry_run:
        description: "Skip LLM calls, produce debug output"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate release notes
        uses: ./
        with:
          version: ${{ github.event.inputs.version }}
          previous_tag: ${{ github.event.inputs.previous_tag || '' }}
          model: ${{ github.event.inputs.model }}
          dry_run: ${{ github.event.inputs.dry_run }}
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ secrets.AZURE_AI_API_BASE }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-notes-v${{ github.event.inputs.version }}
          path: release_notes/v${{ github.event.inputs.version }}.md
          if-no-files-found: error
          retention-days: 14
