name: Generate release notes (self-test)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.3.0)"
        required: true
        type: string
      previous_tag:
        description: "Override previous tag (auto-detect if empty)"
        required: false
        type: string
      model:
        description: "giskard-llm model name"
        required: false
        type: string
        default: azure_ai/gpt-5.4
      dry_run:
        description: "Skip LLM calls, produce debug output"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate release notes
    timeout-minutes: 180
    runs-on: ubuntu-latest
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate release notes
        uses: ./
        with:
          version: ${{ github.event.inputs.version }}
          previous_tag: ${{ github.event.inputs.previous_tag || '' }}
          model: ${{ github.event.inputs.model }}
          dry_run: ${{ github.event.inputs.dry_run }}
        env:
          AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
          AZURE_AI_API_BASE: ${{ vars.AZURE_AI_API_BASE }}
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_API_BASE }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-v${{ github.event.inputs.version }}
          path: release_notes/v${{ github.event.inputs.version }}.md
          if-no-files-found: error
          retention-days: 60
