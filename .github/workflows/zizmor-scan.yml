name: zizmor scan

# Enforced on code repositories by an organization ruleset ("Require workflows
# to pass") and callable as a reusable workflow. Callers must grant at least
# contents: read. A pull_request_target caller would scan the base branch, not
# the pull request.
#
# The scan itself is scripts/zizmor/scan.sh, checked out from this repository
# at the commit that runs (job.workflow_sha): the ruleset's pinned SHA, or the
# caller's pinned ref.

on:
  pull_request:
  merge_group:
  workflow_call:

permissions: {}

# No cancel-in-progress: GitHub does not allow it in a workflow required by a
# ruleset.
concurrency:
  group: ${{ github.workflow }}-zizmor-scan-${{ github.ref }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A pull request could disable rules in its own zizmor config, so pull
      # requests and merge groups use the config of their base commit, and
      # compare their ignore comments with it.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          filter: blob:none
          sparse-checkout: |
            *.yml
            *.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout the Gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gate
          sparse-checkout: scripts/zizmor
          persist-credentials: false

      # Inline ignores are honoured, so each one the pull request adds is
      # surfaced for its reviewers. This step never fails the job.
      - name: Flag new zizmor ignores
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          from collections import Counter
          from pathlib import Path

          MARKER = "zizmor: ignore["


          def ignores(root):
              found = {}
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d != ".git"]
                  for name in filenames:
                      path = Path(dirpath, name)
                      if not name.endswith((".yml", ".yaml")) or path.is_symlink():
                          continue
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for number, line in enumerate(text.splitlines(), 1):
                          if MARKER in line:
                              rel = path.relative_to(root).as_posix()
                              found.setdefault(rel, []).append((number, line.strip()))
              return found


          def escape(value, *, prop=False):
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if prop else value


          base = ignores("base")
          added = []
          for rel, lines in sorted(ignores("src").items()):
              unchanged = Counter(text for _, text in base.get(rel, []))
              for number, text in lines:
                  if unchanged[text]:
                      unchanged[text] -= 1
                  else:
                      added.append((rel, number, text))

          for rel, number, text in added:
              print(
                  f"::warning file={escape(rel, prop=True)},line={number},"
                  f"title=New zizmor ignore::{escape(text)}"
              )
          if added:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "### New zizmor ignores\n\n"
                      "This pull request adds these ignore comments. Check that each reason holds.\n\n"
                      "```text\n"
                  )
                  for rel, number, text in added:
                      summary.write(f"{rel}:{number}: {text}".replace("`", "'") + "\n")
                  summary.write("```\n")
          PY

      - name: Run zizmor
        shell: bash
        env:
          ZIZMOR_FORMAT: github
        run: bash gate/scripts/zizmor/scan.sh src base

  # Pins are checked online only for the references a pull request adds, so a
  # new advisory or an API outage cannot block unrelated pull requests.
  zizmor-pins:
    name: zizmor-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout the Gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: gate
          sparse-checkout: scripts/zizmor
          persist-credentials: false

      - name: Check new action references online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 gate/scripts/zizmor/pins.py src
