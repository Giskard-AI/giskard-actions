name: zizmor scan

# Enforced on every code repository by an organization ruleset ("Require
# workflows to pass") and callable as a reusable workflow. Checkout targets the
# repository the run belongs to. Callers must grant at least contents: read.

on:
  pull_request:
  merge_group:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-zizmor-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A pull request could disable rules in its own zizmor config, so pull
      # requests and merge groups use the config of their base commit.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout zizmor config of the base commit
        if: env.BASE_SHA != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: .zizmor-base
          filter: blob:none
          sparse-checkout: |
            /.github/zizmor.yml
            /.github/zizmor.yaml
            /zizmor.yml
            /zizmor.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select zizmor config of the base commit
        id: config
        if: env.BASE_SHA != ''
        shell: bash
        run: |
          config="${RUNNER_TEMP}/zizmor.yml"
          echo "rules: {}" > "${config}"
          # zizmor's own discovery order; the first file found wins.
          for candidate in .github/zizmor.yml .github/zizmor.yaml zizmor.yml zizmor.yaml; do
            if [[ -f ".zizmor-base/${candidate}" ]]; then
              cp ".zizmor-base/${candidate}" "${config}"
              echo "Using ${candidate} from ${BASE_SHA}"
              break
            fi
          done
          rm -rf .zizmor-base
          echo "path=${config}" >> "${GITHUB_OUTPUT}"

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          config: ${{ steps.config.outputs.path }}
          fail-on-no-inputs: false
          version: "1.32.0"
