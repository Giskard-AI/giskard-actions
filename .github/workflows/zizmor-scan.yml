name: zizmor scan

# Enforced on code repositories by an organization ruleset ("Require workflows
# to pass") and callable as a reusable workflow. Callers must grant at least
# contents: read. A pull_request_target caller would scan the base branch, not
# the pull request.
#
# The scan itself is scripts/zizmor/scan.sh, checked out from this repository
# at the commit that runs (job.workflow_sha): the ruleset's pinned SHA, or the
# caller's pinned ref. The skip-ci-markers job also fails a pull request whose
# title or body would stop CI on the default branch after a squash merge.

on:
  pull_request:
  merge_group:
  workflow_call:

permissions: {}

# No cancel-in-progress: GitHub does not allow it in a workflow required by a
# ruleset.
concurrency:
  group: ${{ github.workflow }}-zizmor-scan-${{ github.ref }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A pull request could disable rules in its own zizmor config, so pull
      # requests and merge groups use the config of their base commit, and
      # compare their ignore comments with it.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          filter: blob:none
          sparse-checkout: |
            *.yml
            *.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Without the running commit, checkout would fall back to the pull
      # request itself and run its scripts.
      - name: Check the Gate commit
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ "${WORKFLOW_REPOSITORY}" != Giskard-AI/giskard-actions || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=zizmor::Cannot tell which giskard-actions commit runs (job.workflow_repository='${WORKFLOW_REPOSITORY}', job.workflow_sha='${WORKFLOW_SHA}')."
            exit 1
          fi

      - name: Checkout the Gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Giskard-AI/giskard-actions
          ref: ${{ job.workflow_sha }}
          path: gate
          sparse-checkout: scripts/zizmor
          persist-credentials: false

      # Inline ignores are honoured, so each one the pull request adds is
      # surfaced for its reviewers. This step never fails the job.
      - name: Flag new zizmor ignores
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          from collections import Counter
          from pathlib import Path

          MARKER = "zizmor: ignore["


          def ignores(root):
              found = {}
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d != ".git"]
                  for name in filenames:
                      path = Path(dirpath, name)
                      if not name.endswith((".yml", ".yaml")) or path.is_symlink():
                          continue
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for number, line in enumerate(text.splitlines(), 1):
                          if MARKER in line:
                              rel = path.relative_to(root).as_posix()
                              found.setdefault(rel, []).append((number, line.strip()))
              return found


          def escape(value, *, prop=False):
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if prop else value


          base = ignores("base")
          added = []
          for rel, lines in sorted(ignores("src").items()):
              unchanged = Counter(text for _, text in base.get(rel, []))
              for number, text in lines:
                  if unchanged[text]:
                      unchanged[text] -= 1
                  else:
                      added.append((rel, number, text))

          for rel, number, text in added:
              print(
                  f"::warning file={escape(rel, prop=True)},line={number},"
                  f"title=New zizmor ignore::{escape(text)}"
              )
          if added:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      "### New zizmor ignores\n\n"
                      "This pull request adds these ignore comments. Check that each reason holds.\n\n"
                      "```text\n"
                  )
                  for rel, number, text in added:
                      summary.write(f"{rel}:{number}: {text}".replace("`", "'") + "\n")
                  summary.write("```\n")
          PY

      - name: Run zizmor
        shell: bash
        env:
          ZIZMOR_FORMAT: github
        run: bash gate/scripts/zizmor/scan.sh src base

  # Pins are checked online only in the files a pull request changes, so a new
  # advisory or an API outage cannot block unrelated pull requests.
  zizmor-pins:
    name: zizmor-pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
    steps:
      # HEAD^1 is the base on pull_request (merge commit) and the previous
      # queue entry on merge_group.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          filter: blob:none
          sparse-checkout: |
            *.yml
            *.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the Gate commit
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ "${WORKFLOW_REPOSITORY}" != Giskard-AI/giskard-actions || ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=zizmor-pins::Cannot tell which giskard-actions commit runs (job.workflow_repository='${WORKFLOW_REPOSITORY}', job.workflow_sha='${WORKFLOW_SHA}')."
            exit 1
          fi

      - name: Checkout the Gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Giskard-AI/giskard-actions
          ref: ${{ job.workflow_sha }}
          path: gate
          sparse-checkout: scripts/zizmor
          persist-credentials: false

      - name: Check new action references online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 gate/scripts/zizmor/pins.py src base

  # A squash merge copies the pull request title and body into the commit on
  # the default branch, and GitHub runs no push workflow for a commit whose
  # message holds a skip instruction. This workflow is the one every code
  # repository must pass, so the check lives here. Ruleset runs ignore
  # `types:` (opened, synchronize and reopened only), so editing the text
  # alone does not re-run it, and a re-run reads the old event payload. On
  # merge_group it checks the commit the queue will push.
  skip-ci-markers:
    name: skip-ci-markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the pull request text for skip instructions
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_GROUP_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          # GitHub's skip instructions ("Skipping workflow runs"). GitHub reads
          # the raw message, so backticks do not protect a marker.
          INSTRUCTION = re.compile(
              r"\[(?:skip ci|ci skip|no ci|skip actions|actions skip)\]", re.IGNORECASE
          )
          TRAILER = re.compile(r"skip-checks:\s*true", re.IGNORECASE)
          DOCS = "https://giskard-ai.github.io/giskard-actions/ci-workflows.html#skip-ci-markers-failed-on-my-pr"
          PULL_REQUEST = (
              "A squash merge copies the pull request title and body into the commit "
              "message on the default branch, and GitHub then runs no push workflow "
              "(CI, release) for that commit. Reword it, for example 'the skip-ci "
              "marker', then push a commit, click Update branch, or close and reopen "
              "the pull request: re-running this job reads the old text."
          )
          MERGE_GROUP = (
              "The merge queue pushes this commit to the default branch, and GitHub "
              "then runs no push workflow (CI, release) for it. Remove the pull "
              "request from the queue, reword its title or body, for example 'the "
              "skip-ci marker', and queue it again."
          )

          found = 0
          for where, name, hint in (
              ("The pull request title", "PR_TITLE", PULL_REQUEST),
              ("The pull request body", "PR_BODY", PULL_REQUEST),
              ("The merge queue commit message", "MERGE_GROUP_MESSAGE", MERGE_GROUP),
          ):
              for number, line in enumerate(os.environ.get(name, "").splitlines(), 1):
                  markers = INSTRUCTION.findall(line)
                  if TRAILER.fullmatch(line.strip()):
                      markers.append(line.strip())
                  at = "" if name == "PR_TITLE" else f" on line {number}"
                  for marker in markers:
                      print(
                          f"::error title=Skip-CI marker::{where} contains {marker}{at}. {hint} See {DOCS}"
                      )
                      found += 1
          sys.exit(1 if found else 0)
          PY
