name: Codex CI Failure Analysis

on: # zizmor: ignore[dangerous-triggers] -- gated to OWNER/MEMBER/COLLABORATOR on /codex-ci-assess
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to analyze
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  collect:
    name: Collect CI failure context
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/codex-ci-assess' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ci
      deployment: false
    permissions:
      actions: read # Read workflow run logs
      checks: read # Read check run statuses
      contents: read # Checkout repository
      issues: read # Read issue comments
      pull-requests: read # Read PR metadata
    outputs:
      should_run: ${{ steps.collect.outputs.should_run }}
      pr_number: ${{ steps.collect.outputs.pr_number }}
      ci_needs_ai: ${{ steps.collect.outputs.ci_needs_ai }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect CI context
        id: collect
        uses: ./.github/actions/codex-ci-collect # zizmor: ignore[self-repository]
        with:
          github_token: ${{ github.token }}
          sonar_qube_token: ${{ secrets.SONAR_QUBE_TOKEN }}

  diagnose:
    name: Diagnose CI failures with Codex
    needs: collect
    if: >-
      needs.collect.result == 'success' &&
      needs.collect.outputs.should_run == 'true' &&
      needs.collect.outputs.ci_needs_ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read # Checkout repository
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CI context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-ci-context
          path: .

      - name: Diagnose CI failures
        uses: ./.github/actions/codex-ci-diagnose # zizmor: ignore[self-repository]
        with:
          responses_api_base: ${{ vars.AZURE_AI_RESPONSES_BASE != '' && vars.AZURE_AI_RESPONSES_BASE || vars.AZURE_AI_API_BASE }}
          azure_ai_api_key: ${{ secrets.AZURE_AI_API_KEY }}

  post:
    name: Post advisory CI analysis comment
    needs: [collect, diagnose]
    if: needs.diagnose.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout repository
      pull-requests: write # Post advisory PR comment
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CI analysis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-final-ci-analysis
          path: .

      - name: Post advisory CI analysis
        uses: ./.github/actions/codex-post-review # zizmor: ignore[self-repository]
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ needs.collect.outputs.pr_number }}
          body_file: assessment/final-ci-analysis.md
