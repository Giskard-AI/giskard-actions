name: Codex PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'codex-review')
      ) ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["/review","/codex-assess"]'), github.event.comment.body) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.codex.outputs.should_run }}
      pr_number: ${{ steps.codex.outputs.pr_number }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Codex PR review
        id: codex
        uses: ./.github/actions/codex-pr-review
        with:
          responses_api_base: ${{ vars.AZURE_AI_RESPONSES_BASE != '' && vars.AZURE_AI_RESPONSES_BASE || vars.AZURE_AI_API_BASE }}
          azure_ai_api_key: ${{ secrets.AZURE_AI_API_KEY }}
          github_token: ${{ github.token }}

  post:
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Codex review artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-reviewer-outputs
          path: .

      - name: Post advisory review
        uses: ./.github/actions/codex-post-review
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ needs.review.outputs.pr_number }}
          body_file: assessment/final-review.md
