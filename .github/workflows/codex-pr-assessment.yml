name: Codex PR Code Review

on: # zizmor: ignore[dangerous-triggers] -- /review gated to OWNER/MEMBER/COLLABORATOR; Codex runs as the Codex User in a read-only, no-network sandbox; the API key stays in codex-action's proxy
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

jobs:
  codex:
    name: Codex PR review
    if: >-
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'codex-review')
      ) ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["/review","/codex-assess"]'), github.event.comment.body) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    # Job-level so comments that fail the gate above never join (and cancel) the group.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
      cancel-in-progress: ${{ github.event_name != 'issue_comment' }}
    permissions:
      contents: read # Read consumer config at the PR base SHA
      issues: read # Read PR conversation comments
      pull-requests: write # Read PR diffs; post the advisory review
    uses: $/.github/workflows/codex-pr-review.yml
    with:
      environment: ci
    secrets:
      AZURE_AI_API_KEY: ${{ secrets.AZURE_AI_API_KEY }}
