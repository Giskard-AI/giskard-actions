name: Codex PR review (reusable)

on:
  workflow_call:
    inputs:
      automation_repository:
        description: Repo that contains scripts/ci/codex_pr_assessment.py (defaults to this workflow's repo)
        type: string
        required: false
        default: ""
      automation_ref:
        description: Git ref/SHA for trusted automation (defaults to github.workflow_sha)
        type: string
        required: false
        default: ""
      github_environment:
        description: GitHub Environment used by Azure Codex jobs
        type: string
        required: false
        default: ci
      review_label:
        description: PR label that starts a review
        type: string
        required: false
        default: codex-review
    secrets:
      AZURE_AI_API_KEY:
        required: true
      AUTOMATION_GITHUB_TOKEN:
        description: Token that can read the automation repository when it is not the caller repo
        required: false

permissions: {}

env:
  # Keep .github/codex/azure-model-catalog.json in sync when bumping this pin.
  CODEX_CLI_VERSION: "0.146.1"
  CODEX_AUTOMATION_DIR: _giskard_codex

jobs:
  resolve:
    name: Resolve pull request
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, inputs.review_label)
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(fromJSON('["/review","/codex-assess"]'), github.event.comment.body) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - name: Resolve automation source
        id: automation
        env:
          INPUT_AUTOMATION_REPOSITORY: ${{ inputs.automation_repository }}
          INPUT_AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          set -euo pipefail
          repo="${INPUT_AUTOMATION_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITHUB_WORKFLOW_REF%%/.github/*}"
          fi
          ref="${INPUT_AUTOMATION_REF:-${GITHUB_WORKFLOW_SHA}}"
          repo="${repo//$'\r'/}"
          repo="${repo//$'\n'/}"
          ref="${ref//$'\r'/}"
          ref="${ref//$'\n'/}"
          printf 'repository=%s\n' "${repo}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.automation.outputs.repository }}
          ref: ${{ steps.automation.outputs.ref }}
          persist-credentials: false
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Resolve pull request
        id: resolve
        env:
          CODEX_ASSESS_COMMENT_COMMANDS: /review,/codex-assess
          CODEX_ASSESS_REQUIRE_SAME_REPO: "true"
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/codex_pr_assessment.py resolve --output "$GITHUB_OUTPUT"

  review-context:
    name: Collect review context
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      has_reviewers: ${{ steps.select.outputs.has_reviewers }}
      reviewer_matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Resolve automation source
        id: automation
        env:
          INPUT_AUTOMATION_REPOSITORY: ${{ inputs.automation_repository }}
          INPUT_AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          set -euo pipefail
          repo="${INPUT_AUTOMATION_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITHUB_WORKFLOW_REF%%/.github/*}"
          fi
          ref="${INPUT_AUTOMATION_REF:-${GITHUB_WORKFLOW_SHA}}"
          repo="${repo//$'\r'/}"
          repo="${repo//$'\n'/}"
          ref="${ref//$'\r'/}"
          ref="${ref//$'\n'/}"
          printf 'repository=%s\n' "${repo}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pull request head as review evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.automation.outputs.repository }}
          ref: ${{ steps.automation.outputs.ref }}
          path: _giskard_codex
          persist-credentials: false
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Collect PR review context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: >-
          python3 _giskard_codex/scripts/ci/codex_pr_assessment.py collect-review
          --pr-number "$PR_NUMBER"
          --output assessment/review-context.json

      - name: Select reviewer passes
        id: select
        env:
          CODEX_REVIEWER_MAP: ${{ github.workspace }}/.github/codex/reviewer-map.json
        run: >-
          python3 _giskard_codex/scripts/ci/codex_pr_assessment.py select
          --context assessment/review-context.json
          --output assessment/reviewers.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload review context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-context
          path: assessment/
          if-no-files-found: error

  reviewer:
    name: Codex reviewer (${{ matrix.name }})
    needs:
      - resolve
      - review-context
    if: needs.review-context.outputs.has_reviewers == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.github_environment }}
      deployment: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.review-context.outputs.reviewer_matrix) }}
    steps:
      - name: Resolve automation source
        id: automation
        env:
          INPUT_AUTOMATION_REPOSITORY: ${{ inputs.automation_repository }}
          INPUT_AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          set -euo pipefail
          repo="${INPUT_AUTOMATION_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITHUB_WORKFLOW_REF%%/.github/*}"
          fi
          ref="${INPUT_AUTOMATION_REF:-${GITHUB_WORKFLOW_SHA}}"
          repo="${repo//$'\r'/}"
          repo="${repo//$'\n'/}"
          ref="${ref//$'\r'/}"
          ref="${ref//$'\n'/}"
          printf 'repository=%s\n' "${repo}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pull request head as review evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.automation.outputs.repository }}
          ref: ${{ steps.automation.outputs.ref }}
          path: _giskard_codex
          persist-credentials: false
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Download review context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-review-context
          path: assessment

      - name: Prepare reviewer prompt
        env:
          REVIEWER_PROMPT_FILE: ${{ matrix.prompt_file }}
          REVIEWER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cp "$REVIEWER_PROMPT_FILE" assessment/reviewer-instructions.md
          {
            cat _giskard_codex/.github/codex/prompts/pr-reviewer.md
            echo
            echo "Reviewer name: ${REVIEWER_NAME}"
          } > assessment/reviewer-task.md

      - name: Validate Azure Responses endpoint
        id: endpoint
        env:
          AZURE_AI_API_BASE: ${{ vars.AZURE_AI_RESPONSES_BASE }}
        run: >-
          python3 _giskard_codex/scripts/ci/codex_pr_assessment.py endpoint
          --base-url "$AZURE_AI_API_BASE"
          --github-output "$GITHUB_OUTPUT"

      - name: Run Codex reviewer
        id: codex
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.AZURE_AI_API_KEY }}
          responses-api-endpoint: ${{ steps.endpoint.outputs.responses_endpoint }}
          # Pin until openai/codex#37380 is fixed (0.147+ Azure empty namespace description).
          # Catalog override is required for gpt-5.6-* on Azure (openai/codex#31882).
          # Keep .github/codex/azure-model-catalog.json in sync with CODEX_CLI_VERSION.
          codex-version: ${{ env.CODEX_CLI_VERSION }}
          model: ${{ matrix.model_kind == 'critical' && 'gpt-5.6-terra' || 'gpt-5.6-luna' }}
          effort: ${{ matrix.model_kind == 'critical' && 'high' || 'medium' }}
          prompt-file: assessment/reviewer-task.md
          output-file: assessment/reviewer-output-${{ matrix.name }}.json
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: "github-actions[bot],cursor[bot],renovate[bot]"
          codex-args: >-
            ["--output-schema","_giskard_codex/.github/codex/schemas/reviewer-output.schema.json","--ephemeral","--config","model_catalog_json=\"${{ github.workspace }}/_giskard_codex/.github/codex/azure-model-catalog.json\""]

      - name: Create reviewer failure placeholder
        if: steps.codex.outcome != 'success'
        env:
          REVIEWER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reviewer = os.environ["REVIEWER_NAME"]
          Path(f"assessment/reviewer-output-{reviewer}.json").write_text(
              json.dumps(
                  {
                      "reviewer": reviewer,
                      "summary": "Reviewer pass failed before producing output.",
                      "findings": [
                          {
                              "category": "informational",
                              "severity": "info",
                              "path": None,
                              "line": None,
                              "title": "Reviewer pass failed",
                              "rationale": "Codex did not produce a reviewer output for this pass. The aggregator should rely on remaining reviewer outputs.",
                              "suggested_action": "Inspect this workflow run if the missing reviewer output matters.",
                          }
                      ],
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload reviewer output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-reviewer-output-${{ matrix.name }}
          path: assessment/reviewer-output-${{ matrix.name }}.json
          if-no-files-found: ignore

  aggregate:
    name: Aggregate code review
    needs:
      - resolve
      - review-context
      - reviewer
    if: always() && needs.resolve.outputs.should_run == 'true' && needs.review-context.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.github_environment }}
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Resolve automation source
        id: automation
        env:
          INPUT_AUTOMATION_REPOSITORY: ${{ inputs.automation_repository }}
          INPUT_AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          set -euo pipefail
          repo="${INPUT_AUTOMATION_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITHUB_WORKFLOW_REF%%/.github/*}"
          fi
          ref="${INPUT_AUTOMATION_REF:-${GITHUB_WORKFLOW_SHA}}"
          repo="${repo//$'\r'/}"
          repo="${repo//$'\n'/}"
          ref="${ref//$'\r'/}"
          ref="${ref//$'\n'/}"
          printf 'repository=%s\n' "${repo}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pull request head as review evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.automation.outputs.repository }}
          ref: ${{ steps.automation.outputs.ref }}
          path: _giskard_codex
          persist-credentials: false
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Download review context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-review-context
          path: assessment

      - name: Prepare reviewer output directory
        run: mkdir -p assessment/reviewer-outputs

      - name: Download reviewer outputs
        if: needs.review-context.outputs.has_reviewers == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-reviewer-output-*
          path: assessment/reviewer-outputs
          merge-multiple: true

      - name: Prepare aggregator prompt
        run: |
          set -euo pipefail
          cp _giskard_codex/.github/codex/prompts/pr-aggregator.md assessment/aggregator-task.md

      - name: Validate Azure Responses endpoint
        id: endpoint
        env:
          AZURE_AI_API_BASE: ${{ vars.AZURE_AI_RESPONSES_BASE }}
        run: >-
          python3 _giskard_codex/scripts/ci/codex_pr_assessment.py endpoint
          --base-url "$AZURE_AI_API_BASE"
          --github-output "$GITHUB_OUTPUT"

      - name: Run Codex code-review aggregator
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.AZURE_AI_API_KEY }}
          responses-api-endpoint: ${{ steps.endpoint.outputs.responses_endpoint }}
          # Pin until openai/codex#37380 is fixed (0.147+ Azure empty namespace description).
          # Catalog override is required for gpt-5.6-* on Azure (openai/codex#31882).
          # Keep .github/codex/azure-model-catalog.json in sync with CODEX_CLI_VERSION.
          codex-version: ${{ env.CODEX_CLI_VERSION }}
          model: gpt-5.6-terra
          effort: high
          prompt-file: assessment/aggregator-task.md
          output-file: assessment/final-review.md
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: "github-actions[bot],cursor[bot],renovate[bot]"
          codex-args: >-
            ["--ephemeral","--config","model_catalog_json=\"${{ github.workspace }}/_giskard_codex/.github/codex/azure-model-catalog.json\""]

      - name: Sanitize final review
        run: >-
          python3 _giskard_codex/scripts/ci/codex_pr_assessment.py sanitize-review
          --input assessment/final-review.md
          --output assessment/final-review.md
          --title "Codex advisory code review"

      - name: Ensure final review exists
        run: test -s assessment/final-review.md

      - name: Upload final review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-final-code-review
          path: assessment/final-review.md
          if-no-files-found: error

  post-review:
    name: Post GitHub code review
    needs:
      - resolve
      - aggregate
    if: needs.resolve.outputs.should_run == 'true' && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve automation source
        id: automation
        env:
          INPUT_AUTOMATION_REPOSITORY: ${{ inputs.automation_repository }}
          INPUT_AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          set -euo pipefail
          repo="${INPUT_AUTOMATION_REPOSITORY:-}"
          if [ -z "${repo}" ]; then
            repo="${GITHUB_WORKFLOW_REF%%/.github/*}"
          fi
          ref="${INPUT_AUTOMATION_REF:-${GITHUB_WORKFLOW_SHA}}"
          repo="${repo//$'\r'/}"
          repo="${repo//$'\n'/}"
          ref="${ref//$'\r'/}"
          ref="${ref//$'\n'/}"
          printf 'repository=%s\n' "${repo}" >> "${GITHUB_OUTPUT}"
          printf 'ref=%s\n' "${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.automation.outputs.repository }}
          ref: ${{ steps.automation.outputs.ref }}
          persist-credentials: false
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN || github.token }}

      - name: Download final review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-final-code-review
          path: assessment

      - name: Post advisory GitHub review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: >-
          python3 scripts/ci/codex_pr_assessment.py post-review
          --pr-number "$PR_NUMBER"
          --body-file assessment/final-review.md
