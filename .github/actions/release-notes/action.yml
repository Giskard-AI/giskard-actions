name: "Giskard Release Notes"
description: "Generate LLM-powered release notes from git history using Linear and GitHub enrichment"

inputs:
  version:
    description: "Release version (e.g., 2.3.0)"
    required: true
  previous_tag:
    description: "Override previous tag (auto-detect if empty)"
    required: false
    default: ""
  model:
    description: "Default giskard-llm model name (e.g. azure_ai/gpt-5.6-luna). Empty falls back to .github/giskard/release-notes.json or azure_ai/gpt-5.6-luna."
    required: false
    default: ""
  effort:
    description: "Default reasoning effort (low, medium, high). Empty falls back to .github/giskard/release-notes.json or high."
    required: false
    default: ""
  consolidation_model:
    description: "Optional model override for Stage 2 per-commit consolidation"
    required: false
    default: ""
  consolidation_effort:
    description: "Optional reasoning effort override for Stage 2 per-commit consolidation"
    required: false
    default: ""
  synthesis_model:
    description: "Optional model override for Stage 3 release notes synthesis"
    required: false
    default: ""
  synthesis_effort:
    description: "Optional reasoning effort override for Stage 3 release notes synthesis"
    required: false
    default: ""
  llm_concurrency:
    description: "Optional max parallel LLM calls during Stage 2 consolidation"
    required: false
    default: ""
  dry_run:
    description: "Skip LLM calls, produce debug output"
    required: false
    default: "false"
  include_appendix:
    description: "Include appendix (diff stats, commit list, per-commit details)"
    required: false
    default: "false"
  output_path:
    description: "Output markdown path relative to repo root (default: release_notes/v{version}.md)"
    required: false
    default: ""
  metadata_file:
    description: "Path to write JSON metadata (default: metadata.json)"
    required: false
    default: "metadata.json"

outputs:
  notes_path:
    description: "Path to the generated markdown file"
    value: ${{ steps.meta.outputs.notes_path }}
  summary:
    description: "Short summary of the release"
    value: ${{ steps.meta.outputs.summary }}
  compare_url:
    description: "GitHub compare URL for the tag range"
    value: ${{ steps.meta.outputs.compare_url }}

runs:
  using: "composite"
  steps:
    - name: Setup Python 3.12 + uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: true
        python-version: "3.12"

    - name: Install release-notes tool
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
        # uv tool install ignores [tool.uv] in pyproject.toml; this keeps the 7-day cooldown
        # on the build backend's dependencies, which uv.lock does not pin. Mirror every
        # exclude-newer-package from pyproject.toml as --exclude-newer-package <name>=false.
        UV_EXCLUDE_NEWER: 7 days
      run: |
        set -euo pipefail
        action_root="$(cd "${ACTION_ROOT}" && pwd)"
        constraints="${RUNNER_TEMP}/giskard-release-notes-constraints.txt"
        uv export --frozen --no-dev --no-hashes --no-emit-project \
          --directory "${action_root}" \
          --output-file "${constraints}"
        if grep -E '^(file://|-e[[:space:]])' "${constraints}"; then
          echo "constraints file must not contain unnamed file:// or -e entries" >&2
          exit 1
        fi
        uv tool install --reinstall --constraints "${constraints}" "${action_root}"

    - name: Resolve output path
      id: resolve
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        python3 "${ACTION_ROOT}/scripts/ci/write_github_output.py" \
          --github-output "${GITHUB_OUTPUT}" \
          --resolve-output-path

    - name: Generate release notes
      shell: bash
      env:
        RELEASE_NOTES_MODEL: ${{ inputs.model }}
        RELEASE_NOTES_EFFORT: ${{ inputs.effort }}
        RELEASE_NOTES_CONSOLIDATION_MODEL: ${{ inputs.consolidation_model }}
        RELEASE_NOTES_CONSOLIDATION_EFFORT: ${{ inputs.consolidation_effort }}
        RELEASE_NOTES_SYNTHESIS_MODEL: ${{ inputs.synthesis_model }}
        RELEASE_NOTES_SYNTHESIS_EFFORT: ${{ inputs.synthesis_effort }}
        INPUT_LLM_CONCURRENCY: ${{ inputs.llm_concurrency }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OUTPUT: ${{ steps.resolve.outputs.output }}
        INPUT_METADATA_FILE: ${{ inputs.metadata_file }}
        INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_INCLUDE_APPENDIX: ${{ inputs.include_appendix }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${INPUT_OUTPUT}")"
        args=(
          --version "${INPUT_VERSION}"
          --output "${INPUT_OUTPUT}"
          --metadata-file "${INPUT_METADATA_FILE}"
        )
        if [ -n "${INPUT_PREVIOUS_TAG}" ]; then
          args+=(--previous-tag "${INPUT_PREVIOUS_TAG}")
        fi
        if [ -n "${INPUT_LLM_CONCURRENCY}" ]; then
          args+=(--llm-concurrency "${INPUT_LLM_CONCURRENCY}")
        fi
        if [ "${INPUT_DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ "${INPUT_INCLUDE_APPENDIX}" = "true" ]; then
          args+=(--include-appendix)
        fi
        generate-release-notes "${args[@]}"

    - name: Read metadata
      id: meta
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
        INPUT_METADATA_FILE: ${{ inputs.metadata_file }}
      run: |
        python3 "${ACTION_ROOT}/scripts/ci/write_github_output.py" \
          --github-output "${GITHUB_OUTPUT}" \
          --metadata-file "${INPUT_METADATA_FILE}"
