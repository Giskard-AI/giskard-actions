name: Codex CI collect
description: Collect and triage CI context for a pull request. Does not call Codex.

inputs:
  github_token:
    description: Token for GitHub Actions/Checks/PR reads
    required: true
  sonar_qube_token:
    description: Optional SonarCloud token
    required: false
    default: ""

outputs:
  should_run:
    description: Whether resolve selected a same-repo PR
    value: ${{ steps.resolve.outputs.should_run }}
  pr_number:
    description: Resolved pull request number
    value: ${{ steps.resolve.outputs.pr_number }}
  ci_ready:
    value: ${{ steps.triage.outputs.ci_ready }}
  ci_needs_ai:
    value: ${{ steps.triage.outputs.ci_needs_ai }}

runs:
  using: composite
  steps:
    - name: Resolve pull request
      id: resolve
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        CODEX_ASSESS_COMMENT_COMMAND: /codex-ci-assess
        CODEX_ASSESS_REQUIRE_SAME_REPO: "true"
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash "${ACTION_LIB}/run-assess.sh" resolve --output "$GITHUB_OUTPUT"
      shell: bash

    - name: Checkout trusted consumer config
      if: steps.resolve.outputs.should_run == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ steps.resolve.outputs.base_sha }}
        path: trusted-config
        persist-credentials: false

    - name: Collect CI context
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        SONAR_QUBE_TOKEN: ${{ inputs.sonar_qube_token }}
        CODEX_CI_CONFIG: ${{ github.workspace }}/trusted-config/.github/codex/ci-config.json
      run: |
        set -euo pipefail
        mkdir -p assessment
        bash "${ACTION_LIB}/run-assess.sh" collect-ci \
          --pr-number "$PR_NUMBER" \
          --output assessment/ci-context.json
      shell: bash

    - name: Triage CI context
      id: triage
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        CODEX_CI_CONFIG: ${{ github.workspace }}/trusted-config/.github/codex/ci-config.json
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" triage-ci
        --context assessment/ci-context.json
        --output assessment/ci-triage.json
        --github-output "$GITHUB_OUTPUT"
      shell: bash

    - name: Upload CI context
      if: steps.resolve.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-ci-context
        path: |
          assessment/ci-context.json
          assessment/ci-triage.json
        if-no-files-found: error
        retention-days: 5
