name: Codex CI diagnose
description: Run Codex CI diagnosis from collected context. Does not post a GitHub review.

inputs:
  responses_api_base:
    description: Azure Responses-compatible API base URL
    required: true
  azure_ai_api_key:
    description: Azure API key for Codex
    required: true

runs:
  using: composite
  steps:
    - name: Prepare CI diagnosis prompt
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        {
          cat "${ACTION_LIB}/../../../.github/codex/prompts/ci-diagnosis.md"
          echo
          echo "Workflow run URL: ${GITHUB_RUN_URL}"
        } > assessment/ci-diagnosis-task.md
      shell: bash

    - name: Validate Azure Responses endpoint
      id: endpoint
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        AZURE_AI_API_BASE: ${{ inputs.responses_api_base }}
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" endpoint
        --base-url "$AZURE_AI_API_BASE"
        --github-output "$GITHUB_OUTPUT"
      shell: bash

    - name: Run Codex CI diagnosis
      timeout-minutes: 8
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      with:
        openai-api-key: ${{ inputs.azure_ai_api_key }}
        responses-api-endpoint: ${{ steps.endpoint.outputs.responses_endpoint }}
        codex-version: "0.146.1"
        model: gpt-5.6-terra
        effort: high
        prompt-file: assessment/ci-diagnosis-task.md
        output-file: assessment/final-ci-analysis.md
        sandbox: read-only
        safety-strategy: drop-sudo
        allow-bots: true
        allow-bot-users: "github-actions[bot],cursor[bot],renovate[bot]"
        codex-args: >-
          ["--ephemeral","--config","model_catalog_json=\"${{ github.action_path }}/../../../.github/codex/azure-model-catalog.json\""]

    - name: Sanitize final CI analysis
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" sanitize-review
        --input assessment/final-ci-analysis.md
        --output assessment/final-ci-analysis.md
        --title "Codex advisory CI analysis"
      shell: bash

    - name: Ensure final CI analysis exists
      run: test -s assessment/final-ci-analysis.md
      shell: bash

    - name: Upload final CI analysis
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-final-ci-analysis
        path: assessment/final-ci-analysis.md
        if-no-files-found: error
        retention-days: 5
