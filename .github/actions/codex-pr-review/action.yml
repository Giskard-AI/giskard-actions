name: Codex PR review
description: Collect PR context and run sequential Codex reviewer passes. Does not post a GitHub review.

inputs:
  responses_api_base:
    description: Azure Responses-compatible API base URL
    required: true
  azure_ai_api_key:
    description: Azure API key for Codex (mapped only onto openai/codex-action)
    required: true
  github_token:
    description: Token for GitHub API reads
    required: true
  normal_model:
    description: Default model for normal reviewer passes (overrides reviewer-map.json defaults if set)
    required: false
    default: ""
  normal_effort:
    description: Default reasoning effort for normal reviewer passes (low, medium, high)
    required: false
    default: ""
  critical_model:
    description: Default model for critical reviewer passes (overrides reviewer-map.json defaults if set)
    required: false
    default: ""
  critical_effort:
    description: Default reasoning effort for critical reviewer passes (low, medium, high)
    required: false
    default: ""
  aggregator_model:
    description: Model for the aggregator pass (overrides reviewer-map.json defaults if set)
    required: false
    default: ""
  aggregator_effort:
    description: Reasoning effort for the aggregator pass (low, medium, high)
    required: false
    default: ""
  codex_version:
    description: Codex CLI version pin
    required: false
    default: "0.146.1"
  model_catalog_path:
    description: Optional path to a custom model_catalog_json (defaults to the action's bundled Azure catalog)
    required: false
    default: ""

outputs:
  should_run:
    description: Whether resolve selected a same-repo PR
    value: ${{ steps.resolve.outputs.should_run }}
  pr_number:
    description: Resolved pull request number
    value: ${{ steps.resolve.outputs.pr_number }}

runs:
  using: composite
  steps:
    - name: Resolve pull request
      id: resolve
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        CODEX_ASSESS_COMMENT_COMMANDS: /review,/codex-assess
        CODEX_ASSESS_REQUIRE_SAME_REPO: "true"
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash "${ACTION_LIB}/run-assess.sh" resolve --output "$GITHUB_OUTPUT"
      shell: bash

    - name: Checkout trusted consumer config
      if: steps.resolve.outputs.should_run == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ steps.resolve.outputs.base_sha }}
        path: trusted-config
        persist-credentials: false

    - name: Collect PR review context
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
      run: |
        set -euo pipefail
        mkdir -p assessment
        bash "${ACTION_LIB}/run-assess.sh" collect-review \
          --pr-number "$PR_NUMBER" \
          --output assessment/review-context.json
      shell: bash

    - name: Select reviewer passes
      id: select
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        CODEX_REVIEWER_MAP: ${{ github.workspace }}/trusted-config/.github/codex/reviewer-map.json
        CODEX_NORMAL_MODEL: ${{ inputs.normal_model }}
        CODEX_NORMAL_EFFORT: ${{ inputs.normal_effort }}
        CODEX_CRITICAL_MODEL: ${{ inputs.critical_model }}
        CODEX_CRITICAL_EFFORT: ${{ inputs.critical_effort }}
        CODEX_AGGREGATOR_MODEL: ${{ inputs.aggregator_model }}
        CODEX_AGGREGATOR_EFFORT: ${{ inputs.aggregator_effort }}
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" select
        --context assessment/review-context.json
        --output assessment/reviewers.json
        --github-output "$GITHUB_OUTPUT"
      shell: bash

    - name: Validate Azure Responses endpoint
      id: endpoint
      if: steps.resolve.outputs.should_run == 'true' && steps.select.outputs.has_reviewers == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        AZURE_AI_API_BASE: ${{ inputs.responses_api_base }}
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" endpoint
        --base-url "$AZURE_AI_API_BASE"
        --github-output "$GITHUB_OUTPUT"
      shell: bash

    - name: Stage reviewer 0
      if: steps.resolve.outputs.should_run == 'true' && steps.select.outputs.reviewer_0_name != ''
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        REVIEWER_NAME: ${{ steps.select.outputs.reviewer_0_name }}
        REVIEWER_REFS: ${{ steps.select.outputs.reviewer_0_refs }}
      run: |
        set -euo pipefail
        mkdir -p assessment/reviewer-outputs
        bash "${ACTION_LIB}/run-assess.sh" stage-overlay \
          --name "$REVIEWER_NAME" \
          --trusted-config trusted-config \
          --output assessment/reviewer-instructions.md \
          --references-output assessment/role-references \
          --role-references "$REVIEWER_REFS"
        {
          cat "${ACTION_LIB}/../../../.github/codex/prompts/pr-reviewer.md"
          echo
          cat "${ACTION_LIB}/../../../.github/codex/prompts/reviewer-pass-wrapper.md"
          echo
          echo "Reviewer name: ${REVIEWER_NAME}"
        } > assessment/reviewer-task.md
      shell: bash

    - name: Run Codex reviewer 0
      id: codex_0
      if: steps.resolve.outputs.should_run == 'true' && steps.select.outputs.reviewer_0_name != ''
      continue-on-error: true
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      with:
        openai-api-key: ${{ inputs.azure_ai_api_key }}
        responses-api-endpoint: ${{ steps.endpoint.outputs.responses_endpoint }}
        codex-version: ${{ inputs.codex_version }}
        model: ${{ steps.select.outputs.reviewer_0_model }}
        effort: ${{ steps.select.outputs.reviewer_0_effort }}
        prompt-file: assessment/reviewer-task.md
        output-file: assessment/reviewer-output-${{ steps.select.outputs.reviewer_0_name }}.json
        sandbox: read-only
        safety-strategy: drop-sudo
        allow-bots: true
        allow-bot-users: "github-actions[bot],cursor[bot],renovate[bot]"
        codex-args: >-
          ["--output-schema","${{ github.action_path }}/../../../.github/codex/schemas/reviewer-output.schema.json","--ephemeral","--config","model_catalog_json=\"${{ inputs.model_catalog_path != '' && inputs.model_catalog_path || format('{0}/../../../.github/codex/azure-model-catalog.json', github.action_path) }}\""]

    - name: Placeholder or stash reviewer 0
      if: steps.resolve.outputs.should_run == 'true' && steps.select.outputs.reviewer_0_name != ''
      env:
        REVIEWER_NAME: ${{ steps.select.outputs.reviewer_0_name }}
        CODEX_OUTCOME: ${{ steps.codex_0.outcome }}
      run: |
        set -euo pipefail
        mkdir -p assessment/reviewer-outputs
        out="assessment/reviewer-output-${REVIEWER_NAME}.json"
        if [ "${CODEX_OUTCOME}" != "success" ] || [ ! -s "$out" ]; then
          python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        reviewer = os.environ["REVIEWER_NAME"]
        Path(f"assessment/reviewer-output-{reviewer}.json").write_text(
            json.dumps(
                {
                    "reviewer": reviewer,
                    "summary": "Reviewer pass failed before producing output.",
                    "findings": [
                        {
                            "category": "informational",
                            "severity": "info",
                            "path": None,
                            "line": None,
                            "title": "Reviewer pass failed",
                            "rationale": "Codex did not produce a reviewer output for this pass.",
                            "suggested_action": "Inspect this workflow run if the missing reviewer output matters.",
                        }
                    ],
                },
                indent=2,
            )
            + "\n",
            encoding="utf-8",
        )
        PY
        fi
        mv -f "$out" "assessment/reviewer-outputs/${REVIEWER_NAME}.json"
        rm -f assessment/reviewer-instructions.md assessment/reviewer-task.md
        rm -rf assessment/role-references
      shell: bash

    - name: Stage reviewer 1
