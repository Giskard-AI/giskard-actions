                            "title": "Reviewer pass failed",
                            "rationale": "Codex did not produce a reviewer output for this pass.",
                            "suggested_action": "Inspect this workflow run if the missing reviewer output matters.",
                        }
                    ],
                },
                indent=2,
            )
            + "\n",
            encoding="utf-8",
        )
        PY
        fi
        mv -f "$out" "assessment/reviewer-outputs/${REVIEWER_NAME}.json"
        rm -f assessment/reviewer-instructions.md assessment/reviewer-task.md
        rm -rf assessment/role-references
      shell: bash

    - name: Prepare aggregator prompt
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
      run: |
        set -euo pipefail
        mkdir -p assessment/reviewer-outputs
        cp "${ACTION_LIB}/../../../.github/codex/prompts/pr-aggregator.md" assessment/aggregator-task.md
      shell: bash

    - name: Validate Azure Responses endpoint for aggregator
      id: agg_endpoint
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
        AZURE_AI_API_BASE: ${{ inputs.responses_api_base }}
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" endpoint
        --base-url "$AZURE_AI_API_BASE"
        --github-output "$GITHUB_OUTPUT"
      shell: bash

    - name: Run Codex code-review aggregator
      if: steps.resolve.outputs.should_run == 'true'
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      with:
        openai-api-key: ${{ inputs.azure_ai_api_key }}
        responses-api-endpoint: ${{ steps.agg_endpoint.outputs.responses_endpoint }}
        codex-version: ${{ inputs.codex_version }}
        model: ${{ steps.select.outputs.aggregator_model }}
        effort: ${{ steps.select.outputs.aggregator_effort }}
        prompt-file: assessment/aggregator-task.md
        output-file: assessment/final-review.md
        sandbox: read-only
        safety-strategy: drop-sudo
        allow-bots: true
        allow-bot-users: "github-actions[bot],cursor[bot],renovate[bot]"
        codex-args: >-
          ["--ephemeral","--config","model_catalog_json=\"${{ inputs.model_catalog_path != '' && inputs.model_catalog_path || format('{0}/../../../.github/codex/azure-model-catalog.json', github.action_path) }}\""]

    - name: Sanitize final review
      if: steps.resolve.outputs.should_run == 'true'
      env:
        ACTION_LIB: ${{ github.action_path }}/../_lib
      run: >-
        bash "${ACTION_LIB}/run-assess.sh" sanitize-review
        --input assessment/final-review.md
        --output assessment/final-review.md
        --title "Codex advisory code review"
      shell: bash

    - name: Ensure final review exists
      if: steps.resolve.outputs.should_run == 'true'
      run: test -s assessment/final-review.md
      shell: bash

    - name: Upload Codex review artifacts
      if: steps.resolve.outputs.should_run == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codex-reviewer-outputs
        path: |
          assessment/review-context.json
          assessment/reviewers.json
          assessment/reviewer-outputs/
          assessment/final-review.md
        retention-days: 7
        if-no-files-found: error
